name = "ddnnf-negation"
defaultTargets = ["DDNNFNegation"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.0"

# The `tutorial_box` attribute records correspondence with tutorial statements.
# It has no proof content.
[[lean_lib]]
name = "TutorialBox"
srcDir = "src"

[[lean_lib]]
name = "DDNNFNegation"
srcDir = "src"

# The six paper corollaries and their supporting constructions.
# The core proof does not import this library.
[[lean_lib]]
name = "DDNNFNegationCorollaries"
srcDir = "src"

# Sanity checks of the boundary definitions on small concrete circuits and
# audits of semantic seams.  Not part of the proof: build with
# `lake build DDNNFNegationTests`.
[[lean_lib]]
name = "DDNNFNegationTests"
srcDir = "src"
